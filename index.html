<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neto Financeiro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="desk">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="13" cy="13" r="12" stroke="currentColor" stroke-width="1.4" opacity="0.35" />
            <path d="M4 13H9L11 8L15 18L17 13H22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="brand-mark-pulse" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Neto Financeiro</span>
          <span class="brand-sub">Controle pessoal &middot; Open Finance</span>
        </span>
      </div>
      <div class="month-switch">
        <button id="prevMonth" class="month-btn" aria-label="Mes anterior">&#8249;</button>
        <span id="currentMonthLabel">-</span>
        <button id="nextMonth" class="month-btn" aria-label="Proximo mes">&#8250;</button>
      </div>
    </header>

    <section class="hero">
      <div class="aurora" aria-hidden="true">
        <span class="aurora-blob aurora-blob-a"></span>
        <span class="aurora-blob aurora-blob-b"></span>
        <span class="aurora-blob aurora-blob-c"></span>
      </div>

      <div class="hero-content">
        <p class="hero-label">Total movimentado no mes</p>
        <p class="hero-amount"><span class="currency">R$</span><span id="totalMes">0,00</span></p>
        <div class="pulse-line" aria-hidden="true"></div>
        <div class="hero-stats">
          <div class="hero-stat">
            <span class="hero-stat-value" id="totalEntradas">0,00</span>
            <span class="hero-stat-label">entradas (PIX recebido)</span>
          </div>
          <div class="hero-stat">
            <span class="hero-stat-value" id="totalSaidas">0,00</span>
            <span class="hero-stat-label">saidas (PIX + cartao)</span>
          </div>
        </div>
      </div>
    </section>

    <main class="layout">

      <section class="ledger-card" aria-label="Transacoes">
        <div class="ledger-header">
          <h2>Transacoes</h2>
          <button id="sincronizarBtn" class="add-btn" type="button">Sincronizar agora</button>
        </div>
        <div id="ledgerBody" class="ledger-body">
          <p class="ledger-empty" id="ledgerEmpty">Nenhuma transacao ainda. Conecte suas contas na Pluggy e aguarde a primeira sincronizacao.</p>
        </div>
      </section>

      <aside class="side-column">
        <section class="panel" id="syncPanel">
          <h3>Sincronizacao</h3>
          <div id="syncStatus" class="sync-status">
            <span class="sync-dot"></span>
            <span id="syncStatusText">Verificando...</span>
          </div>
        </section>

        <section class="panel">
          <h3>Por categoria</h3>
          <div id="categoriaList" class="categoria-list"></div>
        </section>
      </aside>

    </main>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
